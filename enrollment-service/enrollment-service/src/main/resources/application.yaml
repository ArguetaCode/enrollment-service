server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: enrollment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/campusenroll}
    username: ${SPRING_DATASOURCE_USERNAME:campus}
    password: ${SPRING_DATASOURCE_PASSWORD:campus123}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:campus}
    password: ${SPRING_RABBITMQ_PASSWORD:campus123}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        default_schema: campusenroll

campusenroll:
  services:
    student-base-url: ${STUDENT_SERVICE_URL:http://localhost:8081}
    course-base-url: ${COURSE_SERVICE_URL:http://localhost:8082}
    billing-base-url: ${BILLING_SERVICE_URL:http://localhost:8083}

  messaging:
    payments-exchange: campusenroll.payments
    payment-approved-routing-key: payment.approved
    payment-failed-routing-key: payment.failed
    payment-approved-queue: enrollment.payment.approved
    payment-failed-queue: enrollment.payment.failed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
